name: CI

on:
  push:
    branches: [main]
  pull_request:

# 各ジョブの name は ruleset「main: CI を必須にする」の必須チェック名。変えるなら ruleset も直す
# （古い名前のチェックは永遠に来ず、PR がマージできなくなる）。paths で絞ると対象外の PR で同じことが起きる。
jobs:
  nix-eval:
    name: Nix flake evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Evaluate darwin configuration
        run: bash scripts/check.sh nix-eval

  shellcheck:
    name: ShellCheck (severity=error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck, link, hook and agent-skill checks
        run: bash scripts/check.sh shellcheck links hooks guard-main-commit guard-pkill agent-skills guide
