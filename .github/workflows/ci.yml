name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-eval:
    name: Nix flake evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Evaluate darwin configuration
        run: bash scripts/check.sh nix-eval

  shellcheck:
    name: ShellCheck (severity=error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck, link, hook and agent-skill checks
        run: bash scripts/check.sh shellcheck links hooks agent-skills

  cloud-evidence:
    name: Cloud evidence bootstrap and recording
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap recording environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-codex-cloud.sh
      - name: Verify recording from a subsequent shell
        run: bash scripts/check-codex-cloud-evidence.sh
