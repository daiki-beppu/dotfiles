# takt グローバル runtime 設定（~/.takt/runtime.yaml に symlink）
#
# provider / model の割り当てと companion reviewer をここで定義する。
# provider セクションがあると legacy の config.yaml 側の provider / provider_routing /
# persona_providers と共存できず、agent 実行前に "Mixed provider configuration" で止まる。
# どのレイヤー（global / project）の legacy 設定でも止まるので、各リポジトリの
# .takt/config.yaml にも provider 系のキーを書かない。
#
# 構成方針: Claude 主体、レビューだけ Codex
# planner / diagnoser は Claude opus、coder と既定は Claude sonnet、
# reviewer / companion は Codex gpt-6-sol（書き手と査読者を別系統のモデルにして盲点を補い合う）。
# loop monitor の supervisor judge は発火元 step の provider / model を継承する。
#
# project の .takt/runtime.yaml に targets を書くと、global の targets は丸ごと置き換わる
# （profiles は名前単位で合成されるが targets は合成されない。takt 0.66.1 の loader 実装）。
# persona を 1 つだけ上書きしたいリポジトリも、下の targets を全量写して書き換える。
# ここを変えたら、targets を写しているリポジトリも追従させる。

version: 1

provider:
  profiles:
    sonnet:
      provider: claude
      model: sonnet
    opus:
      provider: claude
      model: opus
    sol:
      provider: codex
      model: gpt-6-sol

  # persona 割り当ての無い agent と takt 内部の agent（assistant 等）が使う既定
  defaults:
    profile: sonnet

  targets:
    personas:
      coder:
        profile: sonnet
      planner:
        profile: opus
      # diagnose-fix workflow の診断者。1 run に 1 回しか走らず promotion の保険が効かないため、
      # 初手から最強モデルを置く（診断の誤りは自動 fix の誤りに直結する）
      diagnoser:
        profile: opus
      ai-antipattern-reviewer:
        profile: sol
      architecture-reviewer:
        profile: sol
      coding-reviewer:
        profile: sol
      cqrs-es-reviewer:
        profile: sol
      frontend-reviewer:
        profile: sol
      implementation-semantics-reviewer:
        profile: sol
      merge-readiness-reviewer:
        profile: sol
      qa-reviewer:
        profile: sol
      requirements-reviewer:
        profile: sol
      security-reviewer:
        profile: sol
      terraform-reviewer:
        profile: sol
      testing-reviewer:
        profile: sol
    # companion は builtin の default / maintenance / review-fix 系 workflow が実装 step に
    # 付けている読み取り専用の併走レビュアー。reviewer 系と同じ sol に揃える
    companions:
      ai-antipattern-review-companion:
        profile: sol
      testing-review-companion:
        profile: sol
      review-companion-moderator:
        profile: sol

# v0.64 以降の既定どおり fix_policy は single（指摘は実装者への助言として 1 回だけ渡し、
# 再レビューはしない）。completion = 実装エージェントの成功応答後に累積差分をレビューする
companion:
  enabled: true
  review_mode: completion
  fix_policy: single
