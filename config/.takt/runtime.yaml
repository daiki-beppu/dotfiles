# takt グローバル runtime 設定（~/.takt/runtime.yaml に symlink）
#
# provider / model の割り当てと companion reviewer をここで定義する。
# provider セクションがあると legacy の config.yaml 側の provider / provider_routing /
# persona_providers と共存できず、agent 実行前に "Mixed provider configuration" で止まる。
# どのレイヤー（global / project）の legacy 設定でも止まるので、各リポジトリの
# .takt/config.yaml にも provider 系のキーを書かない。
#
# 構成方針: Claude 主体、レビューだけ Codex
# 計画（planner / diagnoser / research-planner / research-supervisor）は Claude opus、既定は Claude sonnet。
# coder は auto_routing で作業の重さに応じて sonnet-medium / sonnet から、research の量産 step は
# haiku / sonnet / opus から選ぶ。
# reviewer / companion / supervisor は Codex gpt-6.1-sol（書き手と査読者を別系統のモデルにして盲点を補い合う）。
# loop monitor の supervisor judge は発火元 step の provider / model を継承する。
#
# project の .takt/runtime.yaml に targets を書くと、global の targets は丸ごと置き換わる
# （profiles は名前単位で合成されるが targets は合成されない。takt 0.66.1 の loader 実装）。
# persona を 1 つだけ上書きしたいリポジトリも、下の targets を全量写して書き換える。
# ここを変えたら、targets を写しているリポジトリも追従させる。

version: 1

provider:
  profiles:
    sonnet:
      provider: claude
      model: sonnet
    # coder 用。既定の effort（多め）だと、テストを書く・実装の工程で見えない思考が出力の 8〜9 割になり、
    # 1 工程に 40〜75 分かかった（live-mindmap #161、2026-10-05）。中程度に下げて、質はレビューで担保する
    sonnet-medium:
      extends: sonnet
      options:
        effort: medium
    # coder pool で tier high を受け持つ sonnet。auto_routing の tier は profile ごとに 1 つで、
    # research pool の sonnet（medium）と分けるために別名にする
    sonnet-coder:
      extends: sonnet
    opus:
      provider: claude
      model: opus
    # auto_routing の router。作業の重さ（tier）を見積もるだけなので安いモデルで足りる。
    # research pool の tier low も受け持つ
    haiku:
      provider: claude
      model: haiku
    sol:
      provider: codex
      model: gpt-6.1-sol

  # coder と research の量産 step の割り当てを、step ごとに router が選ぶ。router が見積もった tier 以上の候補のうち、
  # balanced は最も低い tier を選ぶ。見積もりに失敗したら fallback_profile に落ちる
  auto_routing:
    strategy: balanced
    router_profile: haiku
    pools:
      coder:
        candidates:
          - profile: sonnet-medium
            tier: low
          # opus は外す。high の見積もりが 4 割近くあり、opus の coder 工程が 1 回 10〜100 分かかって
          # run 全体の時間を押し上げた（2026-10-06〜07、1 run 平均 19 分 → 86 分）。
          # high の候補が 1 つも無いと見積もりが high のとき例外で止まるため、sonnet に high まで受けさせる
          - profile: sonnet-coder
            tier: high
        fallback_profile: sonnet-medium
      # deep-research の dig / analyze。dig は 1 run で数十回並列に呼ばれる量産 step なので、
      # 軽い調べ物は haiku に落として量を削る。Haiku 5.5 は抽出・調べ物の量産向けで、
      # 推論（HLE ツールあり）は Sonnet 5.5 の 64.5% に対し 57.4% と差が小さい（2026-10-08）。
      # 見積もり失敗時は従来どおり sonnet
      research:
        candidates:
          - profile: haiku
            tier: low
          - profile: sonnet
            tier: medium
          - profile: opus
            tier: high
        fallback_profile: sonnet

  # persona 割り当ての無い agent と takt 内部の agent（assistant 等）が使う既定
  defaults:
    profile: sonnet

  targets:
    personas:
      coder:
        pool: coder
      planner:
        profile: opus
      # diagnose-fix workflow の診断者。1 run に 1 回しか走らず promotion の保険が効かないため、
      # 初手から最強モデルを置く（診断の誤りは自動 fix の誤りに直結する）
      diagnoser:
        profile: opus
      # peer-review で reviewer の指摘を採るか退けるかを裁く。裁定の誤りは reviewer の指摘の見落としか
      # 余計な手戻りに直結するので opus にする。2026-10-06〜07 に 1 回 1 分 → 9 分と計測して sonnet に
      # 戻したが、当時の opus は SDK 同梱 CLI 経由で Opus 5 に解決されていた（#254）。Opus 5.5 で測り直す
      review-adjudicator:
        profile: opus
      # final-gate・完了判定・replan 要求。完了を判定する査読側なので reviewer と同じ系統にする
      supervisor:
        profile: sol
      research-planner:
        profile: opus
      research-supervisor:
        profile: opus
      research-digger:
        pool: research
      research-analyzer:
        pool: research
      ai-antipattern-reviewer:
        profile: sol
      architecture-reviewer:
        profile: sol
      coding-reviewer:
        profile: sol
      cqrs-es-reviewer:
        profile: sol
      frontend-reviewer:
        profile: sol
      implementation-semantics-reviewer:
        profile: sol
      merge-readiness-reviewer:
        profile: sol
      qa-reviewer:
        profile: sol
      requirements-reviewer:
        profile: sol
      security-reviewer:
        profile: sol
      terraform-reviewer:
        profile: sol
      testing-reviewer:
        profile: sol
    # companion は builtin の default / maintenance / review-fix 系 workflow が実装 step に
    # 付けている読み取り専用の併走レビュアー。reviewer 系と同じ sol に揃える
    companions:
      ai-antipattern-review-companion:
        profile: sol
      testing-review-companion:
        profile: sol
      review-companion-moderator:
        profile: sol

# v0.64 以降の既定どおり fix_policy は single（指摘は実装者への助言として 1 回だけ渡し、
# 再レビューはしない）。completion = 実装エージェントの成功応答後に累積差分をレビューする
companion:
  enabled: true
  review_mode: completion
  fix_policy: single
