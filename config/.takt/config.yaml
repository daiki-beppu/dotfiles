# takt グローバル設定
#
# 言語・実行制御・observability などを全プロジェクト共通で定義する。
# プロジェクト固有のオーバーライドは各リポジトリの .takt/config.yaml で行う。
#
# provider / model の割り当てと companion reviewer は runtime.yaml が持つ。
# ここ（と各リポジトリの .takt/config.yaml）に provider / model / provider_options /
# provider_routing / persona_providers を書くと runtime.yaml と混在し、
# "Mixed provider configuration" で agent 実行前に止まる。

language: ja

# ── 通知 ──
# 完了・中断・反復上限のデスクトップ通知と通知音を無効にする。
notification_sound: false

# ── 対話モードの形式仕様（v0.63 で構造化、v0.66 で /verify）──
# 対話で固めた要件を Quint / Alloy でも書かせ、/verify で検証器にかける。
# mode 'Y/n' = 毎回聞くが既定は有効（既定の 'y/N' は無効寄り）。
# quint verify と Alloy のモデル検査は Java 17+ が要る（nix/packages.nix の jdk21_headless）
assistant:
  formal_spec:
    mode: 'Y/n'
    comments: true
    model_check_timeout_seconds: 300

# ── 実行制御（並列駆動）──
# takt run / watch のタスクを並列実行する。1=逐次、2-10=ワーカープール。
# 空いたワーカーが次のタスクを取得。Ctrl+C は実行中タスクの完了を待つ（graceful shutdown）。
concurrency: 1               # 逐次実行（1-10）
task_poll_interval_ms: 500   # 新規タスク検出のポーリング間隔（100-5000ms）

# v0.52 新機能: takt run 中に失敗したタスクを自動で再キューする。
# 2 = 一時的な失敗（レート制限・プロバイダ側エラー等）は救済しつつ、
# 恒常的な失敗で無限に回り続けない上限。0 で無効
auto_requeue_max_attempts: 2

# ── Observability（OTLP エクスポート / フェーズ単位 usage 計測）──
# OTEL_EXPORTER_OTLP_ENDPOINT 環境変数を設定すると spans/metrics が送信される。
# 未設定でも monitor・session_log・usage_events_phase は動作する。
observability:
  enabled: true
  monitor: true
  session_log_exporter: true
  usage_events_phase: true

# ── Logging ──
logging:
  usage_events: true

# ── コマンド品質ゲート ──
workflow_command_gates:
  custom_scripts: true
