<title><!-- 2〜4 語の名前。例: Devin完全クラウド運用ノート --></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左に固定目次、右に 68ch の本文カラム。セクションごとに図を1枚。スマホでは目次を上部の横スクロールチップに */
:root {
  --bg: #f5f7f8;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5b6874;
  --line: #d9e0e5;
  --accent: #0f7a78;
  --accent-soft: #e0f1f0;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --surface: #172026; --fg: #e3e9ed; --muted: #95a3ae; --line: #2a3640;
    --accent: #4cc2bd; --accent-soft: #15302f; --warn: #f0b458; --warn-soft: #33270f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #172026; --fg: #e3e9ed; --muted: #95a3ae; --line: #2a3640;
  --accent: #4cc2bd; --accent-soft: #15302f; --warn: #f0b458; --warn-soft: #33270f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.85;
  padding-inline: 16px; padding-block: 0 64px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 56px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 32px); align-self: start; padding-top: 40px; }
nav.toc p { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.5; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); background: var(--accent-soft); outline: none; }
main { min-width: 0; max-width: 68ch; }
header.hero { padding-block: 40px 28px; border-bottom: 1px solid var(--line); }
.eyebrow { font: 600 12px/1.4 var(--f-mono); letter-spacing: .1em; color: var(--accent); margin: 0 0 12px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.3; margin: 0 0 16px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 20px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 700; }
section { padding-block: 44px 8px; scroll-margin-top: 24px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.4; margin: 0 0 6px; text-wrap: balance; }
h2 + .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 32px 0 8px; }
p { margin: 0 0 14px; }
ul { margin: 0 0 16px; padding-left: 1.3em; }
li { margin-bottom: 6px; }
code, .mono { font-family: var(--f-mono); font-size: .88em; background: var(--accent-soft); color: var(--fg); padding: 1px 6px; border-radius: 4px; }
strong { color: var(--fg); }
.key { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; margin: 20px 0; }
.key p { margin: 0; font-weight: 700; }
.note { background: var(--warn-soft); border-radius: 8px; padding: 12px 16px; font-size: 14px; margin: 16px 0; }
.note b { color: var(--warn); }
figure { margin: 24px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow-x: auto; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }
.mermaid { background: transparent; margin: 0; text-align: center; font-family: var(--f-body); }
.tbl { overflow-x: auto; margin: 16px 0 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.6; }
th { font: 600 12px/1.4 var(--f-mono); letter-spacing: .06em; color: var(--muted); background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.pill { display: inline-block; font: 600 11px/1.6 var(--f-mono); padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.stat .n { font: 700 24px/1.2 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.prompt { font-family: var(--f-mono); font-size: 13.5px; line-height: 1.8; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 16px 0; }
.prompt .k { color: var(--accent); font-weight: 600; }
dl.qa { margin: 0; display: grid; gap: 18px; }
dl.qa dt { font-weight: 700; }
dl.qa dt::before { content: "Q. "; font-family: var(--f-mono); color: var(--accent); }
dl.qa dd { margin: 4px 0 0; color: var(--fg); }
dl.qa dd::before { content: "A. "; font-family: var(--f-mono); color: var(--muted); }
ol.todo { padding-left: 1.4em; }
ol.todo li::marker { font-family: var(--f-mono); color: var(--accent); }
a { color: var(--accent); }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.toc { position: static; padding-top: 20px; }
  nav.toc ol { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  nav.toc a { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .stats { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
</style>

<!--
部品の使い分け（必要なものだけ使う）
- .key          その節で一番持ち帰りたい 1 文
- .note         注意・落とし穴・公開範囲など。<b>見出し語</b> から始める
- figure+mermaid 流れ（flowchart）、やりとり（sequenceDiagram）、構成（subgraph）。節ごとに最大 1 枚
- .tbl table    比較・一覧。.pill / .pill.warn で状態を示す
- .stats        数値そのものが要点のときだけ。3 つ並べる
- .prompt       依頼文・設定・手順の型。<span class="k">ラベル</span> 本文
- dl.qa         質疑応答
- ol.todo       自分で試すこと（優先度順）
-->

<div class="wrap">
  <nav class="toc" aria-label="目次">
    <p>Contents</p>
    <ol>
      <li><a href="#sec-id">節の名前</a></li>
    </ol>
  </nav>

  <main>
    <header class="hero">
      <p class="eyebrow">SEMINAR NOTE · YYYY-MM-DD</p>
      <h1>録音全体の主張を 1 文にした見出し</h1>
      <p class="lede">何の録音で、このノートが何を整理したものかを 1〜2 文で。</p>
      <div class="meta">
        <span>登壇 <b>名前</b></span>
        <span>主題 <b>テーマ</b></span>
      </div>
    </header>

    <section id="sec-id">
      <h2>テーマ名</h2>
      <p class="sub">この節の範囲を 1 行で。</p>
      <p>本文。</p>
      <h3>小見出し</h3>
      <ul><li>要点</li></ul>
    </section>

    <section id="qa">
      <h2>質疑応答</h2>
      <p class="sub">当日出た質問。</p>
      <dl class="qa">
        <div><dt>質問</dt><dd>回答</dd></div>
      </dl>
    </section>

    <section id="todo">
      <h2>自分で試すこと</h2>
      <p class="sub">優先度順。</p>
      <ol class="todo">
        <li>具体的な行動</li>
      </ol>
    </section>
  </main>
</div>
